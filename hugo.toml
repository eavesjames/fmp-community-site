baseURL = "https://faultmanagedpower.org/"
languageCode = "en-us"
title = "FaultManagedPower.org"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true
  minifyOutput = true

[permalinks]
  pulse = "/pulse/:slug/"
  digests = "/digests/:slug/"
  posts = "/posts/:slug/"
  analysis = "/analysis/:slug/"
  guides = "/guides/:slug/"
  topics = "/topics/:slug/"
  players = "/players/:slug/"
  glossary = "/glossary/:slug/"
  library = "/library/:slug/"
  tools = "/tools/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[params]
  author = "FaultManagedPower.org"
  description = "The definitive reference for fault managed power — NEC Class 4, installation, estimating, and tools for electricians and integrators."

  colorScheme = "auto"
  defaultAppearance = "light"
  enableSearch = false
  enableCodeCopy = true

  [params.label]
    text = "FaultManagedPower.org"

  [params.homepage]
    layout = "page"
    showRecent = false

  [params.article]
    showDate = true
    showDateUpdated = true
    showBreadcrumbs = true
    showTableOfContents = true
    showTaxonomies = true
    showReadingTime = true

  [params.list]
    showBreadcrumbs = true
    showSummary = true

[taxonomies]
  player = "players"
  topic = "topics"
  value_lever = "value_levers"
  vertical = "verticals"
  persona = "personas"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    identifier = "learn"
    name = "Learn"
    url = "/guides/"
    weight = 10

  [[menu.main]]
    identifier = "tools"
    name = "Tools"
    url = "/tools/"
    weight = 20

  [[menu.main]]
    identifier = "standards"
    name = "Standards"
    url = "/topics/code-standards/"
    weight = 30

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 40
